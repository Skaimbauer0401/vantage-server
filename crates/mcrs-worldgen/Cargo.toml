[package]
name = "mcrs-worldgen"
description = "Bit-exact Rust port of Minecraft's world generation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
md-5 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dev-dependencies]
# examples/fill_profile.rs: a small in-process sampling profiler (no admin rights needed).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
backtrace = "0.3"
